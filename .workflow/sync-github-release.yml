version: "1.0"
name: sync-github-release
displayName: 同步 GitHub Release 到 Gitee
variables:
  GITEE_TOKEN_VAR: c8e4b63dd7fa4b9f60ebeb78b2a522de
triggers:
  push:
    branches:
      prefix:
        - master
stages:
  - stage: sync
    displayName: 同步 Release
    strategy: naturally
    trigger: auto
    steps:
      - step: build@golang
        name: download-and-upload
        displayName: 下载并上传
        golangVersion: 1.21
        commands:
          - |
            set +e
            GH_OWNER="2114460639"
            GH_REPO="redreply"
            GITEE_OWNER="weixiaoshen"
            GITEE_REPO="redreply"
            TOKEN="${GITEE_TOKEN_VAR}"
            BASE="https://gitee.com/api/v5"
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [ -z "$TAG" ]; then echo "未找到 v* tag"; exit 0; fi
            echo "=== 最新 tag: $TAG ==="
            echo "=== 等待 GitHub Release 就绪 ==="
            GH_READY=0
            for i in $(seq 1 30); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "https://api.github.com/repos/$GH_OWNER/$GH_REPO/releases/tags/$TAG")
              if [ "$CODE" = "200" ]; then GH_READY=1; break; fi
              echo "  [$i/30] HTTP $CODE，30秒后重试..."
              sleep 30
            done
            if [ "$GH_READY" = "0" ]; then echo "GitHub Release 未就绪"; exit 1; fi
            echo "=== 下载 GitHub Release 附件 ==="
            mkdir -p release_files
            ASSETS_JSON=$(curl -s --connect-timeout 10 --max-time 30 "https://api.github.com/repos/$GH_OWNER/$GH_REPO/releases/tags/$TAG")
            ASSETS=$(printf '%s' "$ASSETS_JSON" | python3 -c "import sys,json;[print(a['name']+'|'+a['browser_download_url']) for a in json.loads(sys.stdin.read() or '{}').get('assets',[])]" 2>/dev/null)
            if [ -z "$ASSETS" ]; then echo "未找到附件"; exit 1; fi
            echo "$ASSETS" | while IFS="|" read -r NAME URL; do
              echo "  下载 $NAME ..."
              curl -L --connect-timeout 15 --max-time 120 -o "release_files/$NAME" "$URL"
              echo "    完成"
            done
            ls -lh release_files/
            echo "=== 查找 Gitee Release ==="
            EXIST=$(curl -s --connect-timeout 10 --max-time 30 "$BASE/repos/$GITEE_OWNER/$GITEE_REPO/releases/tags/$TAG?access_token=$TOKEN")
            RELEASE_ID=$(printf '%s' "$EXIST" | python3 -c "import sys,json;print(json.loads(sys.stdin.read() or '{}').get('id',''))" 2>/dev/null)
            if [ -n "$RELEASE_ID" ]; then
              echo "  已有 Release id=$RELEASE_ID"
            else
              echo "  创建 Gitee Release..."
              CREATED=$(curl -s --connect-timeout 10 --max-time 30 -X POST "$BASE/repos/$GITEE_OWNER/$GITEE_REPO/releases" -d "access_token=$TOKEN" --data-urlencode "tag_name=$TAG" --data-urlencode "name=$TAG" --data-urlencode "body=redlang $TAG" -d "target_commitish=master&prerelease=false")
              RELEASE_ID=$(printf '%s' "$CREATED" | python3 -c "import sys,json;print(json.loads(sys.stdin.read() or '{}').get('id',''))" 2>/dev/null)
            fi
            echo "=== 上传附件 ==="
            UPLOAD_URL="$BASE/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files"
            OK=0; FAIL=0
            cd release_files
            for f in *; do
              [ -f "$f" ] || continue
              DONE=0
              for i in 1 2 3; do
                echo "  => [$i/3] $f"
                OUT=$(curl -s -w "\nHTTPCODE:%{http_code}" --connect-timeout 10 --max-time 180 -X POST "$UPLOAD_URL" -F "access_token=$TOKEN" -F "file=@$f")
                OCODE=$(echo "$OUT" | tail -n1 | sed 's/^HTTPCODE://')
                if [ "$OCODE" = "200" ] || [ "$OCODE" = "201" ]; then echo "     OK"; DONE=1; OK=$((OK+1)); break; fi
                echo "     FAIL http=$OCODE"; sleep 2
              done
              if [ "$DONE" = "0" ]; then FAIL=$((FAIL+1)); fi
            done
            echo "=== 完成: ok=$OK fail=$FAIL ==="
