name: Build Test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      name:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build
      run: CROSS_NO_WARNINGS=0 cross build --target x86_64-unknown-linux-musl --release
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/x86_64-unknown-linux-musl/release/redlang Release/redlang_linux_x86_64
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_linux_x86_64
        path: Release/redlang_linux_x86_64

  build-linux-i686:
    name: Build Linux i686
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build
      run: CROSS_NO_WARNINGS=0 cross build --target i686-unknown-linux-musl --release
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/i686-unknown-linux-musl/release/redlang Release/redlang_linux_i686
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_linux_i686
        path: Release/redlang_linux_i686

  build-linux-aarch64:
    name: Build Linux aarch64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build
      run: CROSS_NO_WARNINGS=0 cross build --target aarch64-unknown-linux-musl --release
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/aarch64-unknown-linux-musl/release/redlang Release/redlang_linux_aarch64
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_linux_aarch64
        path: Release/redlang_linux_aarch64

  build-android-aarch64:
    name: Build Android aarch64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build
      run: CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/aarch64-linux-android/release/redlang Release/redlang_android_aarch64
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_android_aarch64
        path: Release/redlang_android_aarch64

  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Add target
      run: rustup target add x86_64-pc-windows-msvc
      shell: pwsh
    - name: Build
      run: cargo build --release --target x86_64-pc-windows-msvc
      shell: pwsh
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/x86_64-pc-windows-msvc/release/redlang.exe Release/redlang_windows_x86_64.exe
      shell: pwsh
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_windows_x86_64.exe
        path: Release/redlang_windows_x86_64.exe

  build-windows-i686:
    name: Build Windows i686
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Add target
      run: rustup target add i686-pc-windows-msvc
      shell: pwsh
    - name: Build
      run: cargo build --release --target i686-pc-windows-msvc
      shell: pwsh
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/i686-pc-windows-msvc/release/redlang.exe Release/redlang_windows_i686.exe
      shell: pwsh
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_windows_i686.exe
        path: Release/redlang_windows_i686.exe

  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-i686
      - build-linux-aarch64
      - build-android-aarch64
      - build-windows-x86_64
      - build-windows-i686
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts
    - name: List artifacts
      run: ls -R artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-to-gitee:
    name: Sync to Gitee
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-x86_64
      - build-linux-i686
      - build-linux-aarch64
      - build-android-aarch64
      - build-windows-x86_64
      - build-windows-i686
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Mirror code and tags to Gitee
      run: |
        git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/redreply.git
        git push -f gitee refs/heads/*:refs/heads/*
        git push -f gitee refs/tags/*:refs/tags/*
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts
    - name: Collect binary files
      run: |
        mkdir -p release_files
        find artifacts -type f -exec cp {} release_files/ \;
        ls -lh release_files/
    - name: Create Gitee Release and Upload Assets
      timeout-minutes: 15
      env:
        GITEE_OWNER: ${{ secrets.GITEE_USERNAME }}
        GITEE_REPO: redreply
        GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        python3 - <<'PYEOF'
        import os, sys, json, glob, time
        import urllib.request
        import urllib.parse

        OWNER = os.environ["GITEE_OWNER"]
        REPO = os.environ["GITEE_REPO"]
        TOKEN = os.environ["GITEE_TOKEN"]
        TAG = os.environ["TAG_NAME"]
        BASE = "https://gitee.com/api/v5"

        def req(method, url, data=None, headers=None, timeout=60):
            body = None
            hdrs = {"Accept": "application/json"}
            if headers:
                hdrs.update(headers)
            if data is not None:
                if isinstance(data, dict):
                    body = urllib.parse.urlencode(data).encode()
                    hdrs["Content-Type"] = "application/x-www-form-urlencoded"
                elif isinstance(data, bytes):
                    body = data
            rq = urllib.request.Request(url, data=body, headers=hdrs, method=method)
            try:
                with urllib.request.urlopen(rq, timeout=timeout) as resp:
                    raw = resp.read()
                    try:
                        return resp.status, json.loads(raw.decode() or "{}")
                    except Exception:
                        return resp.status, {"_raw": raw.decode(errors="replace")}
            except urllib.error.HTTPError as e:
                raw = e.read()
                try:
                    return e.code, json.loads(raw.decode() or "{}")
                except Exception:
                    return e.code, {"_raw": raw.decode(errors="replace")}
            except Exception as e:
                return -1, {"error": str(e)}

        # 1. 查找已有 release
        print(f"[1/3] 查找 Gitee Release for tag={TAG} ...")
        code, info = req("GET", f"{BASE}/repos/{OWNER}/{REPO}/releases/tags/{urllib.parse.quote(TAG)}?access_token={TOKEN}", timeout=30)
        release_id = None
        if code == 200 and isinstance(info, dict) and "id" in info:
            release_id = info["id"]
            print(f"  ✓ 找到已有 release id={release_id}")
        else:
            print(f"  未找到 release (code={code}), info={info}")

        # 2. 创建 release（如果不存在）
        if release_id is None:
            print(f"[2/3] 创建 Gitee Release ...")
            payload = {
                "access_token": TOKEN,
                "tag_name": TAG,
                "name": TAG,
                "body": f"redlang {TAG} - 自动同步自 GitHub Actions",
                "target_commitish": "master",
                "prerelease": "false",
            }
            code, info = req("POST", f"{BASE}/repos/{OWNER}/{REPO}/releases", data=payload, timeout=60)
            if code in (200, 201) and isinstance(info, dict) and "id" in info:
                release_id = info["id"]
                print(f"  ✓ 创建成功 release id={release_id}")
            else:
                print(f"  ✗ 创建失败 code={code} info={info}")
                sys.exit(1)
        else:
            print("[2/3] release 已存在，跳过创建")

        # 3. 上传每个文件（逐个，带超时和重试）
        print("[3/3] 上传构建产物 ...")
        files = sorted(glob.glob("release_files/*"))
        if not files:
            print("  ! release_files 目录为空，跳过上传")
            sys.exit(0)
        print(f"  共 {len(files)} 个文件: {[os.path.basename(f) for f in files]}")

        for fp in files:
            fname = os.path.basename(fp)
            fsize = os.path.getsize(fp)
            fsize_mb = fsize / (1024 * 1024)
            # 超时时间根据文件大小计算，最少 180s，每 MB 10s 额外
            t = max(180, int(fsize_mb * 10) + 180)
            uploaded = False
            last_err = ""
            for attempt in range(1, 4):
                print(f"  -> [{attempt}/3] 上传 {fname} ({fsize_mb:.1f} MB), timeout={t}s ...")
                boundary = "----GiteeBoundary" + str(int(time.time() * 1000))
                with open(fp, "rb") as fh:
                    file_bytes = fh.read()
                parts = []
                parts.append(f"--{boundary}\r\n".encode())
                parts.append(f'Content-Disposition: form-data; name="access_token"\r\n\r\n{TOKEN}\r\n'.encode())
                parts.append(f"--{boundary}\r\n".encode())
                parts.append(f'Content-Disposition: form-data; name="file"; filename="{fname}"\r\n'.encode())
                parts.append(b"Content-Type: application/octet-stream\r\n\r\n")
                parts.append(file_bytes)
                parts.append(b"\r\n")
                parts.append(f"--{boundary}--\r\n".encode())
                body = b"".join(parts)
                headers = {"Content-Type": f"multipart/form-data; boundary={boundary}"}
                url = f"{BASE}/repos/{OWNER}/{REPO}/releases/{release_id}/attach_files"
                rq = urllib.request.Request(url, data=body, headers=headers, method="POST")
                try:
                    with urllib.request.urlopen(rq, timeout=t) as resp:
                        raw = resp.read().decode(errors="replace")
                        try:
                            info = json.loads(raw or "{}")
                        except Exception:
                            info = {"_raw": raw}
                        if resp.status in (200, 201) and isinstance(info, dict) and "browser_download_url" in info:
                            print(f"     ✓ 成功: {info['browser_download_url']}")
                            uploaded = True
                            break
                        else:
                            last_err = f"HTTP {resp.status}: {info}"
                            print(f"     ✗ 失败: {last_err}")
                except Exception as e:
                    last_err = str(e)
                    print(f"     ✗ 异常: {last_err}")
                time.sleep(5)
            if not uploaded:
                print(f"  !! 文件 {fname} 上传失败，已跳过: {last_err}")

        print("DONE.")
        PYEOF
