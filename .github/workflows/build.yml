name: Build Test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      name:
        description: 'Log level'
        required: true
        default: 'warning'

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build
      run: CROSS_NO_WARNINGS=0 cross build --target x86_64-unknown-linux-musl --release
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/x86_64-unknown-linux-musl/release/redlang Release/redlang_linux_x86_64
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_linux_x86_64
        path: Release/redlang_linux_x86_64

  build-linux-i686:
    name: Build Linux i686
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build
      run: CROSS_NO_WARNINGS=0 cross build --target i686-unknown-linux-musl --release
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/i686-unknown-linux-musl/release/redlang Release/redlang_linux_i686
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_linux_i686
        path: Release/redlang_linux_i686

  build-linux-aarch64:
    name: Build Linux aarch64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build
      run: CROSS_NO_WARNINGS=0 cross build --target aarch64-unknown-linux-musl --release
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/aarch64-unknown-linux-musl/release/redlang Release/redlang_linux_aarch64
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_linux_aarch64
        path: Release/redlang_linux_aarch64

  build-android-aarch64:
    name: Build Android aarch64
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build
      run: CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/aarch64-linux-android/release/redlang Release/redlang_android_aarch64
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_android_aarch64
        path: Release/redlang_android_aarch64

  build-windows-x86_64:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Add target
      run: rustup target add x86_64-pc-windows-msvc
      shell: pwsh
    - name: Build
      run: cargo build --release --target x86_64-pc-windows-msvc
      shell: pwsh
    - name: Prepare artifact
      run: |
        mkdir Release
        cp target/x86_64-pc-windows-msvc/release/redlang.exe Release/redlang_windows_x86_64.exe
      shell: pwsh
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: redlang_windows_x86_64.exe
        path: Release/redlang_windows_x86_64.exe

  release:
    name: Create Release
    needs:
      - build-linux-x86_64
      - build-linux-i686
      - build-linux-aarch64
      - build-android-aarch64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts
    - name: List artifacts
      run: ls -lhR artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-to-gitee:
    name: Sync to Gitee
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-x86_64
      - build-linux-i686
      - build-linux-aarch64
      - build-android-aarch64
      - build-windows-x86_64
    continue-on-error: true
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Mirror code and tags to Gitee
      run: |
        git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/redreply.git
        git push -f gitee refs/heads/*:refs/heads/*
        git push -f gitee refs/tags/*:refs/tags/*
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts
    - name: Collect binary files
      run: |
        mkdir -p release_files
        find artifacts -type f -exec cp {} release_files/ \;
        ls -lh release_files/
        echo "FILE_COUNT=$(ls -1 release_files | wc -l)" >> $GITHUB_ENV
    - name: Create Gitee Release
      id: create_gitee_release
      env:
        GITEE_OWNER: ${{ secrets.GITEE_USERNAME }}
        GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        set +e
        OWNER="$GITEE_OWNER"
        REPO="redreply"
        TOKEN="$GITEE_TOKEN"
        TAG="$TAG_NAME"
        BASE="https://gitee.com/api/v5"
        # 1. 先查找已有 release
        echo "[1/2] 查找已有 release tag=$TAG ..."
        EXIST=$(curl -s -w "\nHTTPCODE:%{http_code}" \
          --connect-timeout 10 --max-time 30 \
          "$BASE/repos/$OWNER/$REPO/releases/tags/$TAG?access_token=$TOKEN")
        EXIST_BODY=$(echo "$EXIST" | sed '$d')
        EXIST_CODE=$(echo "$EXIST" | tail -n1 | sed 's/^HTTPCODE://')
        echo "  code=$EXIST_CODE body=$EXIST_BODY"
        RELEASE_ID=$(echo "$EXIST_BODY" | python3 -c "import sys,json; d=json.loads(sys.stdin.read() or '{}'); print(d.get('id',''))" 2>/dev/null)
        if [ -n "$RELEASE_ID" ]; then
          echo "[2/2] 已有 release id=$RELEASE_ID，跳过创建"
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          exit 0
        fi
        # 2. 创建新 release
        echo "[2/2] 创建 release ..."
        CREATED=$(curl -s -w "\nHTTPCODE:%{http_code}" \
          --connect-timeout 10 --max-time 60 \
          -X POST "$BASE/repos/$OWNER/$REPO/releases" \
          -d "access_token=$TOKEN" \
          --data-urlencode "tag_name=$TAG" \
          --data-urlencode "name=$TAG" \
          --data-urlencode "body=redlang $TAG - 自动同步自 GitHub Actions" \
          -d "target_commitish=master&prerelease=false")
        CBODY=$(echo "$CREATED" | sed '$d')
        CCODE=$(echo "$CREATED" | tail -n1 | sed 's/^HTTPCODE://')
        echo "  code=$CCODE body=$CBODY"
        RELEASE_ID=$(echo "$CBODY" | python3 -c "import sys,json; d=json.loads(sys.stdin.read() or '{}'); print(d.get('id',''))" 2>/dev/null)
        if [ -z "$RELEASE_ID" ]; then
          echo "  !! 获取 release id 失败，放弃上传附件"
          exit 1
        fi
        echo "  release_id=$RELEASE_ID"
        echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
    - name: Upload assets to Gitee Release
      if: steps.create_gitee_release.outputs.release_id != ''
      env:
        GITEE_OWNER: ${{ secrets.GITEE_USERNAME }}
        GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
        RELEASE_ID: ${{ steps.create_gitee_release.outputs.release_id }}
      run: |
        OWNER="$GITEE_OWNER"
        REPO="redreply"
        TOKEN="$GITEE_TOKEN"
        BASE="https://gitee.com/api/v5"
        URL="$BASE/repos/$OWNER/$REPO/releases/$RELEASE_ID/attach_files"
        cd release_files
        # 如果文件为空跳过
        if [ -z "$(ls -A . 2>/dev/null)" ]; then
          echo "release_files 为空，跳过上传"
          exit 0
        fi
        OK=0
        FAIL=0
        for f in *; do
          [ -f "$f" ] || continue
          FSIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
          FSIZE_MB=$(awk -v s="$FSIZE" 'BEGIN{printf "%.1f", s/1048576}')
          # 总超时：文件越大越长；最长 420s（7分钟），防止整个 job 被卡爆
          MAX_TIME=$(awk -v s="$FSIZE" 'BEGIN{t=int(s/1048576*6)+120; if(t>420) t=420; print t}')
          DONE=0
          for i in 1 2 3; do
            echo "=> [$i/3] $f (${FSIZE_MB}MB) max-time=${MAX_TIME}s url-speed-limit=1K/30s"
            OUT=$(curl -s -w "\nHTTPCODE:%{http_code}" \
              --connect-timeout 15 \
              --max-time "$MAX_TIME" \
              --speed-limit 1024 --speed-time 30 \
              --retry 0 \
              -X POST "$URL" \
              -F "access_token=$TOKEN" \
              -F "file=@$f")
            OBODY=$(echo "$OUT" | sed '$d')
            OCODE=$(echo "$OUT" | tail -n1 | sed 's/^HTTPCODE://')
            DL_URL=$(echo "$OBODY" | python3 -c "import sys,json; d=json.loads(sys.stdin.read() or '{}'); print(d.get('browser_download_url',''))" 2>/dev/null)
            if [ "$OCODE" = "200" ] || [ "$OCODE" = "201" ]; then
              if [ -n "$DL_URL" ]; then
                echo "   OK: $DL_URL"
                DONE=1
                OK=$((OK+1))
                break
              fi
            fi
            echo "   FAIL code=$OCODE body=$OBODY"
            sleep 3
          done
          if [ "$DONE" = "0" ]; then
            FAIL=$((FAIL+1))
            echo "   !! 文件 $f 上传失败（3次重试全部结束，已跳过）"
          fi
        done
        echo "DONE: ok=$OK fail=$FAIL total=$FILE_COUNT"
